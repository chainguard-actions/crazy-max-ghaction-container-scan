name: Test ignore unfixed vulnerabilities
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          image: alpine:3.18
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore_unfixed: 'true'
      - name: Assert JSON output is set
        env:
          JSON_OUT: ${{ steps.scan.outputs.json }}
        run: |
          echo "json output: $JSON_OUT"
          if [ -z "$JSON_OUT" ]; then
            echo "FAIL: expected json output to be non-empty"
            exit 1
          fi
          echo "PASS: json output is set"
      - name: Assert JSON file exists and is valid JSON
        env:
          JSON_OUT: ${{ steps.scan.outputs.json }}
        run: |
          echo "Checking JSON file: $JSON_OUT"
          if [ ! -f "$JSON_OUT" ]; then
            echo "FAIL: JSON output file does not exist at $JSON_OUT"
            exit 1
          fi
          if ! python3 -c "import json, sys; json.load(open('$JSON_OUT'))" 2>/dev/null; then
            echo "FAIL: JSON output file is not valid JSON"
            exit 1
          fi
          echo "PASS: JSON file exists and is valid"
